<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de Imagens | Cidade de Guarulhos</title>
  <link rel="stylesheet" href="css/galeria.css">
</head>
<body>
 
  <header class="topo">
    <h1>Conhecendo Guarulhos em imagens</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="galeria.html" aria-current="page">Galeria de Imagens</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="galeria" aria-labelledby="titulo-galeria">
      <h2 id="titulo-galeria">Lugares para conhecer na cidade</h2>
      <div class="galeria__lista">
        <figure class="cartao">
          <img src="imagens/aeroporto.jpg" alt="aeroporto" loading="lazy">
          <figcaption>
            <h3>Aeroporto</h3>
            <p>conhecido por ser o maior aeroporto da america latina</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/bosque-maia.jpg" alt="bosque maia" loading="lazy">
          <figcaption>
            <h3>Bosque Maia</h3>
            <p>O bosque mais conhecido da cidade marcou a vida de muitos guarulhenses.</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/matriz.jpg" alt="Igreja matriz" loading="lazy">
          <figcaption>
            <h3>Igreja Matriz</h3>
            <p>Conhecida por ser o marco zero da região de Guarulhos</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/shopping-internacional.jpg" alt="shopping-internacional" loading="lazy">
          <figcaption>
            <h3>shopping internacional</h3>
            <p>Um dos maiores Shoppings de São Paulo e possui uma estrutura incrivel em suas lojas</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/natgeo.jpg" alt="Parque de Diversão" loading="lazy">
          <figcaption>
            <h3>Parque Net Geo</h3>
            <p>Parque de diversões que fica dentro do shopping Internacional que possui uma grande variedade de brinquedos</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/chico-mendes.jpg" alt="Parque Chico Mendes" loading="lazy">
          <figcaption>
            <h3>Parque Chico Mendes </h3>
            <p>Parque e Escola que guarda memorias de muitos guarulhenses que ja passaram por lá!</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/terminal-pimentas.jpg" alt="Terminal de Onibus Pimentas" loading="lazy">
          <figcaption>
            <h3>Terminal Pimentas</h3>
            <p>Abrange uma grande quantidade de onibus e linhas, que percorrem por toda a cidade!</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/trevo-bonsucesso.jpg" alt="Trevo Bonsucesso" loading="lazy">
          <figcaption>
            <h3>Trevo Bonsucesso</h3>
            <p>Conecido pelo seu Transito e abrange milhares de carros a cada minuto.</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/CEU-Bonsucesso.jpg" alt="CEU-Bonsucesso" loading="lazy">
          <figcaption>
            <h3>Ceu Bonsucesso</h3>
            <p>Um dos muitos CEU's que a cidade possui, porem o mais conhecido.</p>
          </figcaption>
        </figure>
 
        <figure class="cartao">
          <img src="imagens/francalanza.jpg" alt="Parque francalanza" loading="lazy">
          <figcaption>
            <h3>Parque francalanza</h3>
            <p>Possui uma mini cidade, para ensinar as crianças as regras e sinalizações de transito com bicicletas!</p>
          </figcaption>
        </figure>
 
      </div>
    </section>
  </main>
 
  <footer class="rodape">
    <p>Atividade de Arte e Desenvolvimento Web · IFSP Guarulhos</p>
  </footer>
 
</body>
</html>
